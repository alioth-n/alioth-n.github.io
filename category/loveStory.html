            "歷史故事": "重視共同回憶與過去，關係是時間的延伸。",
            "科學故事": "用理性、邏輯分析感情，試圖找出公式。",
            "食譜故事": "認為愛情有標準程序，照著做就會幸福。",
            "戰爭故事": "認為愛情轟轟烈烈，吵架是關心與在乎。",
            "劇場故事": "關係像演戲，重視儀式感與場面。",
            "幽默故事": "用輕鬆幽默化解問題，避免過度嚴肅。",
            "神祕故事": "保持神祕感，讓對方慢慢探索自己。"
        };

        const warningStories = ["恐怖故事", "成癮故事", "警察故事", "遊戲故事"];

        // ========== 動態產生測驗 ==========
        const quizBody = document.getElementById('quizBody');
        const answeredCountSpan = document.getElementById('answeredCount');
        const progressBar = document.getElementById('progressBar');
        const submitBtn = document.getElementById('submitBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resultSection = document.getElementById('resultSection');
        const resultContent = document.getElementById('resultContent');
        const quizContainer = document.getElementById('quizContainer');
        const retakeBtn = document.getElementById('retakeBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        // 隨機排序函數
        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // 產生題目 HTML（隨機排列，不顯示故事類型）
        function renderQuiz() {
            const shuffledQuestions = shuffleArray(questions);
            let html = '';
            shuffledQuestions.forEach((q, index) => {
                const displayNum = index + 1;
                html += `<div class="question-item" data-qid="${q.id}">`;
                html += `<div class="question-text">${displayNum}. ${q.text}</div>`;
                html += `<div class="options">`;
                for (let val = 1; val <= 5; val++) {
                    const labelText = ['非常不同意','不同意','普通','同意','非常同意'][val-1];
                    html += `<label class="option-label" data-qid="${q.id}" data-val="${val}">`;
                    html += `<input type="radio" name="q${q.id}" value="${val}"> ${labelText}`;
                    html += `</label>`;
                }
                html += `</div></div>`;
            });
            quizBody.innerHTML = html;

            document.querySelectorAll('.option-label').forEach(label => {
                label.addEventListener('click', function(e) {
                    const qid = this.dataset.qid;
                    const val = this.dataset.val;
                    document.querySelectorAll(`.option-label[data-qid="${qid}"]`).forEach(l => l.classList.remove('selected'));
                    this.classList.add('selected');
                    updateProgress();
                });
            });
        }

        // 更新進度
        function updateProgress() {
            const total = questions.length;
            let answered = 0;
            questions.forEach(q => {
                const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
                if (selected) answered++;
            });
            answeredCountSpan.textContent = answered;
            progressBar.style.width = (answered / total * 100) + '%';
        }

        // 重設測驗
        function resetQuiz() {
            document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
            document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
            updateProgress();
            resultSection.style.display = 'none';
            quizContainer.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 計算結果
        function calculateResults() {
            const answers = {};
            questions.forEach(q => {
                const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
                answers[q.id] = selected ? parseInt(selected.value) : 3;
            });

            const storyScores = {};
            const storyCounts = {};
            questions.forEach(q => {
                if (!storyScores[q.story]) {
                    storyScores[q.story] = 0;
                    storyCounts[q.story] = 0;
                }
                storyScores[q.story] += answers[q.id];
                storyCounts[q.story]++;
            });

            const storyAverages = {};
            Object.keys(storyScores).forEach(story => {
                storyAverages[story] = storyScores[story] / storyCounts[story];
            });

            const categoryScores = {};
            const categoryCounts = {};
            questions.forEach(q => {
                if (!categoryScores[q.category]) {
                    categoryScores[q.category] = 0;
                    categoryCounts[q.category] = 0;
                }
                categoryScores[q.category] += answers[q.id];
                categoryCounts[q.category]++;
            });
            const categoryAverages = {};
            Object.keys(categoryScores).forEach(cat => {
                categoryAverages[cat] = categoryScores[cat] / categoryCounts[cat];
            });

            return { storyAverages, categoryAverages };
        }

        // 顯示結果
        function showResults() {
            const { storyAverages, categoryAverages } = calculateResults();
            const sortedStories = Object.entries(storyAverages).sort((a,b) => b[1] - a[1]);
            const topStories = sortedStories.slice(0, 5);

            let html = '';
            const categories = ["不對稱故事", "物件故事", "協作故事", "敘事故事", "類型故事"];
            const categoryTitles = {
                "不對稱故事": "🔀 不對稱故事（權力或角色不平等）",
                "物件故事": "📦 物件故事（將伴侶或關係視為物件）",
                "協作故事": "🤝 協作故事（關係是合作與配合）",
                "敘事故事": "📖 敘事故事（愛情應遵循某種既定文本）",
                "類型故事": "🎭 類型故事（強調互動模式與氣氛）"
            };

            html += `<div class="result-card"><h2>五大類愛情故事傾向</h2>`;
            categories.forEach(cat => {
                const avg = categoryAverages[cat] || 0;
                const pct = (avg / 5 * 100).toFixed(0);
                const color = getBarColor(avg);
                html += `<div class="bar-row">
                    <span class="bar-label">${cat}</span>
                    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color};"></div></div>
                    <span class="bar-value">${avg.toFixed(2)}</span>
                </div>`;
            });
            html += `</div>`;

            html += `<div class="result-card"><h2>你的主要愛情劇本（前5名）</h2>`;
            topStories.forEach(([story, score]) => {
                const desc = storyDescriptions[story] || '';
                html += `<div class="story-result-item">
                    <h3>${story} <span class="story-score">${score.toFixed(2)} / 5.00</span></h3>
                    <p>${desc}</p>
                </div>`;
                if (warningStories.includes(story) && score >= 3.5) {
                    html += `<div class="${story === '恐怖故事' ? 'danger-box' : 'warning-box'}">
                        ⚠️ 你在此劇本的分數偏高，可能反映關係中有些值得留意的模式。建議進一步自我覺察，必要時尋求專業協助。
                    </div>`;
                }
            });
            html += `</div>`;

            html += `<div class="result-card"><h2>完整故事分數一覽</h2>`;
            sortedStories.forEach(([story, score]) => {
                const pct = (score / 5 * 100).toFixed(0);
                html += `<div class="bar-row">
                    <span class="bar-label">${story}</span>
                    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${getBarColor(score)};"></div></div>
                    <span class="bar-value">${score.toFixed(2)}</span>
                </div>`;
            });
            html += `</div>`;

            resultContent.innerHTML = html;
            resultSection.style.display = 'block';
            quizContainer.style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function getBarColor(score) {
            if (score >= 4) return '#00b894';
            if (score >= 3) return '#6c5ce7';
            if (score >= 2) return '#fdcb6e';
            return '#e17055';
        }

        // 下載結果圖片
        function downloadResultImage() {
            if (typeof html2canvas === 'undefined') {
                alert('圖片下載功能需要網路連線載入 html2canvas 庫，請確認網路後重試。');
                return;
            }
            const element = document.getElementById('resultContent');
            html2canvas(element, {
                scale: 2,
                backgroundColor: '#ffffff',
                useCORS: true,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '愛情故事測驗結果.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error(err);
                alert('圖片生成失敗，請稍後重試。');
            });
        }

        submitBtn.addEventListener('click', function() {
            let unanswered = 0;
            questions.forEach(q => {
                if (!document.querySelector(`input[name="q${q.id}"]:checked`)) unanswered++;
            });
            if (unanswered > 0) {
                if (!confirm(`有 ${unanswered} 題尚未作答，未作答的題目將以「普通(3分)」計算。確定要繼續嗎？`)) {
                    return;
                }
            }
            showResults();
        });

        resetBtn.addEventListener('click', resetQuiz);
        retakeBtn.addEventListener('click', resetQuiz);
        downloadBtn.addEventListener('click', downloadResultImage);

        renderQuiz();
        updateProgress();
    </script>
</body>
</html>
